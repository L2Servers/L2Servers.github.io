        {

                el:"Σπάνιος C2 διακομιστής που διατηρεί την πρώιμη ατμόσφαιρα και μηχανική του Lineage 2.",

        },
        {
            name:"L2Origins", chronicle:"C1", online:"200+", rates:"x1",
            desc:{
                en:"The dawn of Lineage 2 — pure C1 experience for true veterans and collectors.",
                ru:"Рассвет Lineage 2 — чистый C1 для настоящих ветеранов и коллекционеров.",
                el:"Η αυγή του Lineage 2 — καθαρή εμπειρία C1 για πραγματικούς βετεράνους.",
                "pt-br":"O amanhecer do Lineage 2 — experiência C1 pura para verdadeiros veteranos.",
                lt:"Lineage 2 aušra — gryna C1 patirtis tikriems veteranams.",
                es:"El amanecer de Lineage 2 — experiencia C1 pura para verdaderos veteranos.",
                tr:"Lineage 2'in şafğı — gerçek veterinerler için saf C1 deneyimi.",
                sl:"Zora Lineage 2 — čista C1 izkušnja za prave veterane.",

    /* ===== ХРОНИКИ И ИХ ЦВЕТА ===== */
    const chronicles = ["All","Essence","Classic","High Five","Interlude","Epilogue","GoD","C6","C4","C3","C2","C1"];
    const chronClasses = {
        "Essence":"chron-essence","Classic":"chron-classic","High Five":"chron-hf",
        "Interlude":"chron-interlude","Epilogue":"chron-epilogue","GoD":"chron-god",
        "C6":"chron-c6","C4":"chron-c4","C3":"chron-c3","C2":"chron-c2","C1":"chron-c1"
    };

    /* ===== ЯЗЫКИ ===== */
    const languages = [
        {code:"en",label:"EN"},
        {code:"ru",label:"RU"},
        {code:"el",label:"EL"},
        {code:"pt-br",label:"PT"},
        {code:"lt",label:"LT"},
        {code:"es",label:"ES"},
        {code:"tr",label:"TR"},
        {code:"sl",label:"SL"},
        {code:"de",label:"DE"}
    ];

    /* ===== ГЕНЕРАЦИЯ URL ===== */
    function serverUrl(name) {
        return "https://dalam.world/?ref_id=qnlxdo8bvf&link=" + encodeURIComponent(name.replace(/\s+/g,'_'));
    }

    /* ===== РЕНДЕР ЯЗЫКОВОЙ ПАНЕЛИ ===== */
    function renderLangBar() {
        const bar = document.getElementById('langBar');
        bar.innerHTML = languages.map(l =>
            `<button class="lang-btn ${l.code===currentLang?'active':''}" data-lang="${l.code}" aria-label="Switch to ${l.label}">${l.label}</button>`
        ).join('');
        bar.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentLang = btn.dataset.lang;
                document.documentElement.lang = currentLang;
                renderLangBar();
                renderFilters();
                renderFeatured();
                renderServers();
                updateUIText();
            });
        });
    }

    /* ===== ОБНОВЛЕНИЕ UI-ТЕКСТОВ ===== */
    function updateUIText() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.textContent = t(el.dataset.i18n);
        });
    }

    /* ===== РЕНДЕР ФИЛЬТРОВ ===== */
    let activeFilter = "All";
    function renderFilters() {
        const bar = document.getElementById('filterBar');
        bar.innerHTML = chronicles.map(c => {
            const label = c === "All" ? t('filter_all') : c;
            return `<button class="filter-btn ${c===activeFilter?'active':''}" data-chron="${c}">${label}</button>`;
        }).join('');
        bar.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                activeFilter = btn.dataset.chron;
                renderFilters();
                renderServers();
            });
        });
    }

    /* ===== РЕНДЕР ТЕГОВ ===== */
    function renderTags(tags) {
        return tags.map(tag => {
            const label = t('tag_'+tag);
            return `<span class="platform-tag">${label}</span>`;
        }).join(' ');
    }

    /* ===== РЕНДЕР РЕКОМЕНДОВАННОГО ===== */
    function renderFeatured() {
        const s = servers.find(srv => srv.featured);
        if (!s) return;
        const url = serverUrl(s.name);
        const card = document.getElementById('featuredCard');
        card.innerHTML = `
            <a href="${url}" target="_blank" rel="noopener noreferrer" class="featured-card rounded-2xl p-8 md:p-10 block gold-glow-strong no-underline" style="animation:fadeInUp 0.6s ease forwards" aria-label="${s.name}">
                <div class="flex flex-col lg:flex-row gap-8 items-start">
                    <div class="flex-1">
                        <div class="flex flex-wrap items-center gap-3 mb-4">
                            <span class="chronicle-badge ${chronClasses[s.chronicle]}">${s.chronicle}</span>
                            ${renderTags(s.tags)}
                        </div>
                        <h3 class="font-display font-bold text-3xl md:text-4xl text-gold-300 mb-4">${s.name}</h3>
                        <p class="text-gray-300 text-lg mb-6 leading-relaxed">${s.desc[currentLang]||s.desc.en}</p>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                            <div class="bg-white/5 rounded-lg p-4 text-center">
                                <div class="text-xs text-gray-500 mb-1 uppercase tracking-wider">${t('online')}</div>
                                <div class="flex items-center justify-center gap-2">
                                    <span class="pulse-dot"></span>
                                    <span class="text-gold-400 font-bold text-xl">${s.online}</span>
                                </div>
                            </div>
                            <div class="bg-white/5 rounded-lg p-4 text-center">
                                <div class="text-xs text-gray-500 mb-1 uppercase tracking-wider">${t('rates')}</div>
                                <div class="text-gold-400 font-bold text-xl">${s.rates}</div>
                            </div>
                            <div class="bg-white/5 rounded-lg p-4 text-center">
                                <div class="text-xs text-gray-500 mb-1 uppercase tracking-wider">${t('players')}</div>
                                <div class="text-gold-400 font-bold text-xl">${s.online}</div>
                            </div>
                        </div>
                        <div class="flex flex-wrap items-center gap-4">
                            <span class="play-btn"><i class="fa-solid fa-play text-sm"></i> ${t('btn_play')}</span>
                        </div>
                    </div>
                    <div class="lg:w-80 w-full">
                        <div class="bg-black/30 rounded-xl p-6 border border-white/5">
                            <h4 class="font-display text-sm text-gold-500 mb-4 uppercase tracking-wider">${s.name} Features</h4>
                            <ul class="space-y-3">
                                <li class="flex items-start gap-3">
                                    <i class="fa-solid fa-gem text-gold-500 mt-1 text-sm"></i>
                                    <span class="text-gray-300 text-sm">${t('dw_special1')}</span>
                                </li>
                                <li class="flex items-start gap-3">
                                    <i class="fa-solid fa-laptop text-gold-500 mt-1 text-sm"></i>
                                    <span class="text-gray-300 text-sm">${t('dw_special2')}</span>
                                </li>
                                <li class="flex items-start gap-3">
                                    <i class="fa-solid fa-users-gear text-gold-500 mt-1 text-sm"></i>
                                    <span class="text-gray-300 text-sm">${t('dw_special3')}</span>
                                </li>
                            </ul>
                            <div class="mt-5 pt-4 border-t border-white/5">
                                <div class="flex items-center gap-2 text-xs text-gray-500">
                                    <i class="fa-brands fa-windows"></i>
                                    <i class="fa-brands fa-apple"></i>
                                    <i class="fa-brands fa-android"></i>
                                    <span class="ml-1">Windows / MacOS / Android</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </a>
        `;
    }

    /* ===== РЕНДЕР СПИСКА СЕРВЕРОВ ===== */
    function renderServers() {
        const grid = document.getElementById('serverGrid');
        const noRes = document.getElementById('noResults');
        const filtered = activeFilter === "All" ? servers.filter(s => !s.featured) : servers.filter(s => s.chronicle === activeFilter && !s.featured);

        if (filtered.length === 0) {
            grid.innerHTML = '';
            noRes.classList.remove('hidden');
            return;
        }
        noRes.classList.add('hidden');

        grid.innerHTML = filtered.map((s, i) => {
            const url = serverUrl(s.name);
            return `
                <a href="${url}" target="_blank" rel="noopener noreferrer" class="server-card rounded-xl p-6 block no-underline reveal" style="transition-delay:${i*60}ms" aria-label="${s.name}">
                    <div class="flex items-start justify-between mb-4">
                        <div>
                            <div class="flex flex-wrap items-center gap-2 mb-2">
                                <span class="chronicle-badge ${chronClasses[s.chronicle]}">${s.chronicle}</span>
                                ${s.tags.map(tag => `<span class="platform-tag">${t('tag_'+tag)}</span>`).join('')}
                            </div>
                            <h3 class="font-display font-bold text-xl text-gray-100">${s.name}</h3>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0 ml-3">
                            <span class="pulse-dot" style="width:6px;height:6px"></span>
                            <span class="text-green-400 text-sm font-semibold">${s.online}</span>
                        </div>
                    </div>
                    <p class="text-gray-400 text-sm mb-5 leading-relaxed line-clamp-2">${s.desc[currentLang]||s.desc.en}</p>
                    <div class="flex items-center justify-between">
                        <span class="text-gray-600 text-xs font-semibold uppercase tracking-wider">${t('rates')}: ${s.rates}</span>
                        <span class="play-btn text-xs py-1.5 px-4"><i class="fa-solid fa-play text-xs"></i> ${t('btn_play')}</span>
                    </div>
                </a>
            `;
        }).join('');

        /* Запуск scroll reveal для новых элементов */
        observeRevealElements();
    }

    /* ===== SCROLL REVEAL ===== */
    function observeRevealElements() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold:0.1, rootMargin:'0px 0px -40px 0px' });

        document.querySelectorAll('.reveal:not(.visible)').forEach(el => observer.observe(el));
    }

    /* ===== СИСТЕМА ЧАСТИЦ ===== */
    function initParticles() {
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let w, h;
        const particles = [];
        const PARTICLE_COUNT = 60;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        /* Создание частиц */
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.3,
                vy: -Math.random() * 0.5 - 0.1,
                size: Math.random() * 2 + 0.5,
                alpha: Math.random() * 0.5 + 0.1,
                alphaSpeed: (Math.random() - 0.5) * 0.005,
                hue: 35 + Math.random() * 20 /* Золотой диапазон */
            });
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha += p.alphaSpeed;
                if (p.alpha <= 0.05 || p.alpha >= 0.6) p.alphaSpeed *= -1;
                p.alpha = Math.max(0.05, Math.min(0.6, p.alpha));

                /* Перенос за границы */
                if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
                if (p.x < -10) p.x = w + 10;
                if (p.x > w + 10) p.x = -10;

                /* Отрисовка с мягким свечением */
                const r = Math.max(0.5, p.size);
                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3);
                gradient.addColorStop(0, `hsla(${p.hue}, 80%, 60%, ${p.alpha})`);
                gradient.addColorStop(0.5, `hsla(${p.hue}, 70%, 50%, ${p.alpha * 0.3})`);
                gradient.addColorStop(1, `hsla(${p.hue}, 60%, 40%, 0)`);
                ctx.beginPath();
                ctx.arc(p.x, p.y, r * 3, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        /* Проверяем prefers-reduced-motion */
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (!mq.matches) animate();
    }

    /* ===== ИНИЦИАЛИЗАЦИЯ ===== */
    document.addEventListener('DOMContentLoaded', () => {
        renderLangBar();
        renderFilters();
        renderFeatured();
        renderServers();
        updateUIText();
        initParticles();
        observeRevealElements();
    });
    </script>
</body>
</html>
